name: CI

on:
  pull_request:
    branches:
      - main
    # Never create a run for a release-please PR. GITHUB_TOKEN-opened PRs land in
    # action_required and never start; excluding the exact release-output set means
    # no run is created at all. push/tag/release triggers are unaffected.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
  workflow_dispatch:

# No job writes to GitHub: checkout reads the repository, and setup-go's module
# cache goes through the Actions cache service, not this token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    # A runaway guard, not a target: it keeps a wedged runner well short of
    # the six-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/no-mistakes

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The e2e suite drives the real no-mistakes binary against a fake
      # agent through `git push -> daemon -> pipeline -> push to upstream`
      # for claude, codex, grok, and opencode. It builds the binary itself, so
      # no separate build step is needed.
      - name: End-to-end suite
        run: make e2e
