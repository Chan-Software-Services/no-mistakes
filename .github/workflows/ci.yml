name: CI

on:
  pull_request:
    branches:
      - main
    # Never create a run for a release-please PR. GITHUB_TOKEN-opened PRs land in
    # action_required and never start; excluding the exact release-output set means
    # no run is created at all. push/tag/release triggers are unaffected.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
  workflow_dispatch:

# No job writes to GitHub: checkout reads the repository, and setup-go's module
# cache goes through the Actions cache service, not this token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    # A runaway guard, not a target: it keeps a wedged runner well short of
    # the six-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/no-mistakes

  # The e2e suite drives the real no-mistakes binary against a fake agent
  # through `git push -> daemon -> pipeline -> push to upstream` for every
  # agent. Its tests cannot run in parallel within one process (each harness
  # sets process-wide env), and serially they outgrew one runner's timeout, so
  # three runners each take a third of them: scripts/e2e.sh --shard deals the
  # tests out round-robin in name order, and shard 1 also runs the step-local
  # e2e packages. Each shard builds the binary itself, so no build step is
  # needed. The shard count is the matrix's length (strategy.job-total).
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: End-to-end suite shard
        run: bash scripts/e2e.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The one e2e check: it passes only when every shard passed, so a shard that
  # failed, was cancelled or never ran fails it.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: test "$SHARDS" = success
